<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" stroke="url(#goldGrad)" stroke-width="8" fill="none" opacity="0.3" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="#f59e0b" opacity="0.1" filter="url(#glow)" />
  
  <!-- Bakery Chef Hat & Pizza Icon -->
  <g transform="translate(106, 80)">
    <!-- Pizza Slice -->
    <path d="M150 180 L280 20 A300 300 0 0 1 20 280 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <!-- Pepperoni circles -->
    <circle cx="150" cy="120" r="18" fill="#ef4444" />
    <circle cx="100" cy="180" r="16" fill="#ef4444" />
    <circle cx="200" cy="160" r="15" fill="#ef4444" />
    <!-- Cheese Drizzle -->
    <path d="M 120 100 Q 150 140 180 110" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>
  
  <!-- Text BB -->
  <text x="256" y="440" font-family="'Jost', 'Segoe UI', sans-serif" font-weight="900" font-size="52" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">BABLI BAKERY</text>
</svg>
